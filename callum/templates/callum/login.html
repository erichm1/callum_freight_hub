{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Callum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/custom.css' %}" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh; background: var(--clm-ink);">
  <div class="card shadow-lg border-0" style="width: 360px; border-radius: var(--clm-radius);">
    <div class="card-body p-4">
      <div class="d-flex align-items-center mb-4">
        <span class="clm-brand-mark" style="background: var(--clm-signal); color:#14100c; width:34px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;">C</span>
        <span class="ms-2 clm-display fw-bold fs-4">Callum</span>
      </div>
      <p class="text-muted small mb-4">Freight gateway console — sign in to manage shipments across air, sea and land.</p>
      <form method="post">
        {% csrf_token %}
        {% if form.errors %}
          <div class="alert alert-danger py-2 small">Invalid username or password.</div>
        {% endif %}
        <div class="mb-3">
          <label class="form-label small">Username</label>
          <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label small">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-clm-primary w-100">Sign in</button>
        <input type="hidden" name="next" value="{{ next }}">
      </form>
    </div>
  </div>
</body>
</html>
